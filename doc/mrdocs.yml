# Input
source-root: ..
# Directories that contain documented source files
input:
  - ../include
# Patterns to filter out the source-files in the directories
file-patterns:
  - '*.hpp'

# Filters
include-symbols:
  - 'boost::corosio::**'
# The awaitables' captured state. Each `*_awaitable` is a nested `struct`, so its
# data members are PUBLIC by C++ default -- they are not private and
# `extract-private` has nothing to filter. They are storage for one in-flight
# operation on a type the user only ever `co_await`s, never constructs or
# inspects, so they are internals in every sense but the language's.
#
# Excluding rather than making them private is deliberate: reaching them from
# `detail::bytes_op_base<>` would need a friend declaration naming a detail
# template in a public header, which is exactly what the compilation firewall in
# doc/design/physical-structure.md exists to prevent.
exclude-symbols:
  - 'boost::corosio::**::*_awaitable::s_'
  - 'boost::corosio::**::*_awaitable::f_'
  - 'boost::corosio::**::*_awaitable::w_'
  - 'boost::corosio::**::*_awaitable::ios_'
  - 'boost::corosio::**::*_awaitable::buf_'
  - 'boost::corosio::**::*_awaitable::buffers_'
  - 'boost::corosio::**::*_awaitable::dest_'
  - 'boost::corosio::**::*_awaitable::source_'
  - 'boost::corosio::**::*_awaitable::endpoint_'
  - 'boost::corosio::**::*_awaitable::flags_'
  - 'boost::corosio::**::*_awaitable::offset_'
  - 'boost::corosio::**::*_awaitable::token_'
  - 'boost::corosio::**::*_awaitable::bytes_'
  - 'boost::corosio::**::*_awaitable::ec_'
# `io_context::sched_` and the copy its executor holds are `protected:`, which
# `extract-private` does not filter -- protected members are part of the
# interface a derived class sees. This one is not: it is the scheduler pointer
# the backend installs during construction.
  - 'boost::corosio::io_context::sched_'
  - 'boost::corosio::io_context::executor_type::sched_'
implementation-defined:
  - 'boost::corosio::detail'
  - 'boost::corosio::*::detail'
# `inaccessible-members`/`inaccessible-bases` are gone on develop, which is the
# channel the docs are pinned to (see doc/local-playbook.yml). Their job is done
# by the extract-private* defaults: dropping the two keys left the generated page
# set identical, and the rendered corpus is diffed against a pre-change baseline
# to confirm no inaccessible member or base leaked into the reference.

# Generator. Spelled `generator` since develop; the Antora reference extension
# passes --generator=adoc explicitly in any case.
generator: adoc
base-url: https://www.github.com/cppalliance/corosio/blob/develop/

# Style
verbose: true
multipage: true
# use-system-libc: true
# use-system-stdlib: true

# Sorting
sort-members-relational-last: false

# Warnings. These feed doc/lint/mrdocs-warnings.mjs, which parses the build log.
# Adopted for parity with Capy, whose config enables the same set. MrDocs turns
# warn-if-undocumented and warn-no-paramdoc on by default, so those were already
# in force here; warn-unnamed-param, warn-broken-ref and warn-if-doc-error were
# not, and each surfaces a class of finding Corosio was previously blind to.
# Deliberately not warn-as-error: the mrdocs_warnings gate reports rather than
# blocks (see .github/workflows/docs.yml), because MrDocs is a rolling
# develop-release build whose output moves on its own.
warnings: true
warn-if-undocumented: true
warn-no-paramdoc: true
warn-unnamed-param: true
warn-broken-ref: true
warn-if-doc-error: true

# Reference examples are injected by addons/extensions/reference-snippets.lua.
# MrDocs loads extensions from <install>/share/mrdocs/addons/extensions, so the
# doc build installs it there (see doc/build_antora.sh). Setting
# `addons-supplemental` here does NOT work: the key is recognised but only the
# command-line flag reaches extension discovery, and the Antora extension does
# not expose one.

cmake: '-DCMAKE_CXX_STANDARD=20 -DBOOST_COROSIO_MRDOCS_BUILD=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=OFF'
